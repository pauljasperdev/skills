      <script>
        {
          // cues are voiceover seconds (prep/voiceover.words.json); the voiceover plays at RATE, T() gives scene-local time
          const VO0 = 49.016666;
          const RATE = 1.1;
          const DUR = 7.266667;
          const T = (vo) => Math.max(0, Math.round(((vo - VO0) / RATE) * 1000) / 1000);
          const tl = gsap.timeline({ paused: true });
          const pop = (target, vo) => tl.fromTo(target, { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.34, ease: "back.out(2)" }, T(vo));
          const rise = (target, vo) => tl.fromTo(target, { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, T(vo));
          const slide = (target, vo, x = -60) => tl.fromTo(target, { x, opacity: 0 }, { x: 0, opacity: 1, duration: 0.36, ease: "power3.out" }, T(vo));
          const draw = (target, vo, duration = 0.4) => {
            tl.set(target, { opacity: 1 }, T(vo));
            tl.fromTo(target, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration, ease: "power2.out" }, T(vo));
          };
          const fade = (target, vo, to = 0) => tl.to(target, { opacity: to, duration: 0.25, ease: "power1.out" }, T(vo));
          const leave = () => tl.to("#kunden-art", { opacity: 0, duration: 0.18, ease: "power1.in" }, DUR - 0.2);

          pop("#kunden-t1", 49.1); // "OpenAI"
          rise("#kunden-lt1", 49.2);

          draw("#kunden-a1", 51.62, 0.45); // "bei"
