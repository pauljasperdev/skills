<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: Urbanist;
          src: url("assets/fonts/urbanist-latin-400-700.woff2") format("woff2");
          font-weight: 400 900;
          font-display: block;
        }
        @font-face {
          font-family: "DM Sans";
          src: url("assets/fonts/dm-sans-latin-400-700.woff2") format("woff2");
          font-weight: 400 900;
          font-display: block;
        }

        #cloud-root {
          position: absolute;
          inset: 0;
        }
        /* graphics sit between the top rail (y 265) and the caption box (y 1500) */
        #cloud-art {
          position: absolute;
          inset: 0;
          font-family: Urbanist, sans-serif;
          font-weight: 800;
          letter-spacing: -0.02em;
          text-transform: uppercase;
          color: #1c1c1c;
        }
        #cloud-art .in {
          opacity: 0;
        }
        #cloud-art .a {
          color: #0d9488;
        }
        #cloud-art .h {
          position: absolute;
          left: 90px;
          top: 356px;
          width: 900px;
          font-size: 96px;
          line-height: 0.98;
          letter-spacing: -0.025em;
          text-align: center;
        }
        #cloud-art .h .ln {
          display: block;
          white-space: nowrap;
        }
        /* a label: place it with left/top/width/height, size it with font-size */
        #cloud-art .lbl {
          position: absolute;
          display: flex;
          align-items: center;
          justify-content: center;
          line-height: 1;
          white-space: nowrap;
        }
        #cloud-art .sm {
          font-family: "DM Sans", sans-serif;
          font-weight: 700;
          letter-spacing: 0.1em;
        }
        #cloud-art .card,
        #cloud-art .tile {
          position: absolute;
          display: flex;
          align-items: center;
          justify-content: center;
          border: 4px solid #1c1c1c;
          background: #ffffff;
          box-shadow: 8px 8px 0 #1c1c1c;
        }
        #cloud-art .card img {
          display: block;
          height: auto;
        }
        #cloud-art .tile svg {
          display: block;
        }
        #cloud-svg {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 1920px;
          overflow: visible;
        }
        /* strokes that draw on */
        #cloud-svg .ink {
          fill: none;
          stroke: #1c1c1c;
          stroke-width: 7;
          stroke-linecap: round;
          stroke-linejoin: round;
          stroke-dasharray: 1;
          stroke-dashoffset: 1;
          opacity: 0;
        }
        #cloud-svg .accent {
          stroke: #0d9488;
        }
        #cloud-svg .warn {
          stroke: #dc2626;
        }
      </style>

      <div id="cloud-root" data-composition-id="cloud" data-width="1080" data-height="1920" data-duration="7.8">
        <div id="cloud-art">
          <div class="h"><span id="cloud-h1" class="ln in">Rechenleistung</span><span id="cloud-h2" class="ln a in">übers Internet</span></div>
          <svg id="cloud-svg" viewBox="0 0 1080 1920">
            <g transform="translate(700 770) scale(0.62) translate(-550 -835)"><path id="cloud-cloud" pathLength="1" class="ink" style="stroke-width: 11" d="M300 1010 C215 1010 170 950 190 885 C205 830 260 800 310 810 C325 730 400 680 480 700 C530 640 650 640 700 715 C790 700 870 760 860 850 C920 870 930 960 880 995 C850 1012 820 1010 790 1010 Z" /></g>
            <rect pathLength="1" class="ink rk" x="620" y="712" width="160" height="34" />
            <rect pathLength="1" class="ink rk" x="620" y="758" width="160" height="34" />
            <rect pathLength="1" class="ink rk" x="620" y="804" width="160" height="34" />
            <path id="cloud-firm" pathLength="1" class="ink" d="M200 1230 V1030 H360 V1230 M180 1230 H380 M262 1230 V1180 h36 v50 M235 1075 h30 M295 1075 h30 M235 1125 h30 M295 1125 h30" />
            <path id="cloud-net" pathLength="1" class="ink accent" d="M280 1010 C280 900 360 850 458 850" />
            <path id="cloud-neth" pathLength="1" class="ink accent" d="M432 826 L462 850 L432 874" />
            <g id="cloud-owng">
              <rect pathLength="1" class="ink own" x="725" y="1030" width="150" height="200" />
              <path pathLength="1" class="ink own" d="M725 1097 H875 M725 1163 H875 M750 1064 h20 M750 1130 h20 M750 1197 h20" />
              <path id="cloud-x" pathLength="1" class="ink warn" style="stroke-width: 11" d="M705 1015 L895 1245 M895 1015 L705 1245" />
            </g>
          </svg>
          <div id="cloud-lfirm" class="lbl in" style="left: 180px; top: 1250px; width: 200px; height: 50px; font-size: 46px">Firma</div>
          <div id="cloud-lnet" class="lbl sm in" style="left: 330px; top: 904px; width: 220px; height: 40px; font-size: 30px">Internet</div>
          <div id="cloud-lown" class="lbl in" style="left: 600px; top: 1250px; width: 400px; height: 50px; font-size: 44px">Eigene Server</div>
          <div id="cloud-t1" class="tile in" style="left: 612px; top: 1040px; width: 160px; height: 160px">
            <svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="#1c1c1c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.5l2.2 10.5h10.3l1.8-7.5H7" /><circle cx="9.5" cy="19" r="1.4" /><circle cx="17" cy="19" r="1.4" /></svg>
          </div>
          <div id="cloud-lt1" class="lbl in" style="left: 592px; top: 1226px; width: 200px; height: 50px; font-size: 44px">Shop</div>
          <div id="cloud-t2" class="tile in" style="left: 822px; top: 1040px; width: 160px; height: 160px">
            <svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="#1c1c1c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3" /><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6" /><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6" /></svg>
          </div>
          <div id="cloud-lt2" class="lbl in" style="left: 802px; top: 1226px; width: 200px; height: 50px; font-size: 44px">Daten</div>
        </div>
      </div>

      <script>
        {
          // cues are voiceover seconds (prep/voiceover.words.json); the voiceover plays at RATE, T() gives scene-local time
          const VO0 = 8.536666;
          const RATE = 1.1;
          const DUR = 7.8;
          const T = (vo) => Math.max(0, Math.round(((vo - VO0) / RATE) * 1000) / 1000);
          const tl = gsap.timeline({ paused: true });
          const pop = (target, vo) => tl.fromTo(target, { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.34, ease: "back.out(2)" }, T(vo));
          const rise = (target, vo) => tl.fromTo(target, { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, T(vo));
          const slide = (target, vo, x = -60) => tl.fromTo(target, { x, opacity: 0 }, { x: 0, opacity: 1, duration: 0.36, ease: "power3.out" }, T(vo));
          const draw = (target, vo, duration = 0.4) => {
            tl.set(target, { opacity: 1 }, T(vo));
            tl.fromTo(target, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration, ease: "power2.out" }, T(vo));
          };
          const fade = (target, vo, to = 0) => tl.to(target, { opacity: to, duration: 0.25, ease: "power1.out" }, T(vo));
          const leave = () => tl.to("#cloud-art", { opacity: 0, duration: 0.18, ease: "power1.in" }, DUR - 0.2);

          draw("#cloud-cloud", 8.76, 0.7); // "Cloud"
          draw("#cloud-firm", 9.66, 0.6); // "Firma"
          rise("#cloud-lfirm", 9.8);
          rise("#cloud-h1", 9.96); // "Rechenleistung"
          draw("#cloud-svg .rk", 9.96, 0.4);
          rise("#cloud-h2", 10.7); // "über das Internet"
          draw("#cloud-net", 10.7, 0.5);
          draw("#cloud-neth", 11.1, 0.15);
          rise("#cloud-lnet", 11.06);
          draw("#cloud-svg .own", 11.9, 0.45); // "eigene Server"
          rise("#cloud-lown", 12);
          draw("#cloud-x", 12.78, 0.25); // "kaufen"
          fade("#cloud-owng", 13.32); // "Zum Beispiel"
          fade("#cloud-lown", 13.32);
          pop("#cloud-t1", 14.52); // "Online-Shop"
          rise("#cloud-lt1", 14.6);
          pop("#cloud-t2", 16.02); // "Daten speichern"
          rise("#cloud-lt2", 16.1);
          leave();
          window.__timelines["cloud"] = tl;
        }
      </script>
    </template>
  </body>
</html>
