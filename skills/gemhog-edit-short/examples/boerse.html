<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: Urbanist;
          src: url("assets/fonts/urbanist-latin-400-700.woff2") format("woff2");
          font-weight: 400 900;
          font-display: block;
        }
        @font-face {
          font-family: "DM Sans";
          src: url("assets/fonts/dm-sans-latin-400-700.woff2") format("woff2");
          font-weight: 400 900;
          font-display: block;
        }

        #boerse-root {
          position: absolute;
          inset: 0;
        }
        /* graphics sit between the top rail (y 265) and the caption box (y 1500) */
        #boerse-art {
          position: absolute;
          inset: 0;
          font-family: Urbanist, sans-serif;
          font-weight: 800;
          letter-spacing: -0.02em;
          text-transform: uppercase;
          color: #1c1c1c;
        }
        #boerse-art .in {
          opacity: 0;
        }
        #boerse-art .a {
          color: #0d9488;
        }
        #boerse-art .h {
          position: absolute;
          left: 90px;
          top: 356px;
          width: 900px;
          font-size: 96px;
          line-height: 0.98;
          letter-spacing: -0.025em;
          text-align: center;
        }
        #boerse-art .h .ln {
          display: block;
          white-space: nowrap;
        }
        /* a label: place it with left/top/width/height, size it with font-size */
        #boerse-art .lbl {
          position: absolute;
          display: flex;
          align-items: center;
          justify-content: center;
          line-height: 1;
          white-space: nowrap;
        }
        #boerse-art .sm {
          font-family: "DM Sans", sans-serif;
          font-weight: 700;
          letter-spacing: 0.1em;
        }
        #boerse-art .card,
        #boerse-art .tile {
          position: absolute;
          display: flex;
          align-items: center;
          justify-content: center;
          border: 4px solid #1c1c1c;
          background: #ffffff;
          box-shadow: 8px 8px 0 #1c1c1c;
        }
        #boerse-art .card img {
          display: block;
          height: auto;
        }
        #boerse-art .tile svg {
          display: block;
        }
        #boerse-svg {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 1920px;
          overflow: visible;
        }
        /* strokes that draw on */
        #boerse-svg .ink {
          fill: none;
          stroke: #1c1c1c;
          stroke-width: 7;
          stroke-linecap: round;
          stroke-linejoin: round;
          stroke-dasharray: 1;
          stroke-dashoffset: 1;
          opacity: 0;
        }
        #boerse-svg .accent {
          stroke: #0d9488;
        }
        #boerse-svg .warn {
          stroke: #dc2626;
        }

        #boerse-eq {
          position: absolute;
          left: 90px;
          top: 352px;
          width: 900px;
          height: 84px;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 24px;
          font-size: 70px;
          line-height: 1;
          letter-spacing: -0.025em;
          white-space: nowrap;
        }
        #boerse-eq .w {
          display: block;
          flex: none;
        }
        #boerse-art .bar {
          position: absolute;
          width: 260px;
          border: 4px solid #1c1c1c;
          border-bottom: 0;
          transform-origin: 50% 100%;
        }
        #boerse-art .numb {
          position: absolute;
          width: 400px;
          height: 150px;
          display: flex;
          align-items: baseline;
          justify-content: center;
          font-size: 150px;
          line-height: 150px;
          white-space: nowrap;
        }
        #boerse-art .numb span {
          display: block;
        }
      </style>

      <div id="boerse-root" data-composition-id="boerse" data-width="1080" data-height="1920" data-duration="11.566666">
        <div id="boerse-art">
          <div id="boerse-eq">
            <span id="boerse-w1" class="w in">Neo Cloud</span>
            <svg id="boerse-ne" class="w in" width="64" height="60" viewBox="0 0 64 60"><path d="M6 21 H58 M6 41 H58 M44 4 L20 56" fill="none" stroke="#0d9488" stroke-width="9" stroke-linecap="round" /></svg>
            <span id="boerse-w2" class="w in">Neo Cloud</span>
          </div>
          <div id="boerse-n1" class="lbl sm in" style="left: 90px; top: 476px; width: 900px; height: 40px; font-size: 30px">Bewertung = Vielfaches des Umsatzes</div>
          <div id="boerse-n2" class="lbl sm in" style="left: 90px; top: 518px; width: 900px; height: 40px; font-size: 30px; color: #555555">der letzten 12 Monate</div>
          <div id="boerse-b1" class="bar" style="left: 180px; top: 1212px; height: 70px; background: #1c1c1c"></div>
          <div id="boerse-b2" class="bar" style="left: 640px; top: 762px; height: 520px; background: #0d9488"></div>
          <div id="boerse-v1" class="numb in" style="left: 110px; top: 1060px"><span>~</span><span id="boerse-v1n">6</span><span>×</span></div>
          <div id="boerse-v2" class="numb a in" style="left: 570px; top: 610px"><span id="boerse-v2n">45</span><span>×</span></div>
          <svg id="boerse-svg" viewBox="0 0 1080 1920">
            <path id="boerse-base" pathLength="1" class="ink" d="M110 1282 H970" />
          </svg>
          <div id="boerse-c1" class="card in" style="left: 160px; top: 1304px; width: 300px; height: 96px"><img src="assets/logos/coreweave_logo.png" alt="CoreWeave" style="width: 240px" /></div>
          <div id="boerse-c2" class="card in" style="left: 620px; top: 1304px; width: 300px; height: 96px"><img src="assets/logos/nebius_logo.png" alt="Nebius" style="width: 200px" /></div>
        </div>
      </div>

      <script>
        {
          // cues are voiceover seconds (prep/voiceover.words.json); the voiceover plays at RATE, T() gives scene-local time
          const VO0 = 57.01;
          const RATE = 1.1;
          const DUR = 11.566666;
          const T = (vo) => Math.max(0, Math.round(((vo - VO0) / RATE) * 1000) / 1000);
          const tl = gsap.timeline({ paused: true });
          const pop = (target, vo) => tl.fromTo(target, { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.34, ease: "back.out(2)" }, T(vo));
          const rise = (target, vo) => tl.fromTo(target, { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, T(vo));
          const slide = (target, vo, x = -60) => tl.fromTo(target, { x, opacity: 0 }, { x: 0, opacity: 1, duration: 0.36, ease: "power3.out" }, T(vo));
          const draw = (target, vo, duration = 0.4) => {
            tl.set(target, { opacity: 1 }, T(vo));
            tl.fromTo(target, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration, ease: "power2.out" }, T(vo));
          };
          const fade = (target, vo, to = 0) => tl.to(target, { opacity: to, duration: 0.25, ease: "power1.out" }, T(vo));
          const leave = () => tl.to("#boerse-art", { opacity: 0, duration: 0.18, ease: "power1.in" }, DUR - 0.2);

          pop("#boerse-w1", 58.34); // "Neo-Cloud"
          pop("#boerse-ne", 59.02); // "nicht gleich"
          pop("#boerse-w2", 59.92); // "Neo-Cloud"
          draw("#boerse-base", 60.8, 0.5);
          pop("#boerse-c1", 61.2); // "CoreWeave"
          rise("#boerse-n1", 62.08); // "mit ungefähr dem ..."
          // "6-fachen": the bar grows, the number rides its top and counts up
          tl.fromTo("#boerse-b1", { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "power2.out" }, T(62.8));
          tl.fromTo("#boerse-v1", { y: 70 }, { y: 0, duration: 0.5, ease: "power2.out" }, T(62.8));
          tl.to("#boerse-v1", { opacity: 1, duration: 0.12 }, T(62.8));
          tl.fromTo("#boerse-v1n", { textContent: 0 }, { textContent: 6, snap: { textContent: 1 }, duration: 0.5, ease: "power2.out" }, T(62.8));
          rise("#boerse-n2", 64.46); // "der letzten 12 Monate"
          pop("#boerse-c2", 66.64); // "Nebius"
          // "45-fache"
          tl.fromTo("#boerse-b2", { scaleY: 0 }, { scaleY: 1, duration: 0.9, ease: "power2.out" }, T(67.86));
          tl.fromTo("#boerse-v2", { y: 520 }, { y: 0, duration: 0.9, ease: "power2.out" }, T(67.86));
          tl.to("#boerse-v2", { opacity: 1, duration: 0.12 }, T(67.86));
          tl.fromTo("#boerse-v2n", { textContent: 0 }, { textContent: 45, snap: { textContent: 1 }, duration: 0.9, ease: "power2.out" }, T(67.86));
          leave();
          window.__timelines["boerse"] = tl;
        }
      </script>
    </template>
  </body>
</html>
