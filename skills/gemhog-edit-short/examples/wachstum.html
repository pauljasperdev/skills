<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: Urbanist;
          src: url("assets/fonts/urbanist-latin-400-700.woff2") format("woff2");
          font-weight: 400 900;
          font-display: block;
        }
        @font-face {
          font-family: "DM Sans";
          src: url("assets/fonts/dm-sans-latin-400-700.woff2") format("woff2");
          font-weight: 400 900;
          font-display: block;
        }

        #wachstum-root {
          position: absolute;
          inset: 0;
        }
        /* graphics sit between the top rail (y 265) and the caption box (y 1500) */
        #wachstum-art {
          position: absolute;
          inset: 0;
          font-family: Urbanist, sans-serif;
          font-weight: 800;
          letter-spacing: -0.02em;
          text-transform: uppercase;
          color: #1c1c1c;
        }
        #wachstum-art .in {
          opacity: 0;
        }
        #wachstum-art .a {
          color: #0d9488;
        }
        #wachstum-art .h {
          position: absolute;
          left: 90px;
          top: 356px;
          width: 900px;
          font-size: 96px;
          line-height: 0.98;
          letter-spacing: -0.025em;
          text-align: center;
        }
        #wachstum-art .h .ln {
          display: block;
          white-space: nowrap;
        }
        /* a label: place it with left/top/width/height, size it with font-size */
        #wachstum-art .lbl {
          position: absolute;
          display: flex;
          align-items: center;
          justify-content: center;
          line-height: 1;
          white-space: nowrap;
        }
        #wachstum-art .sm {
          font-family: "DM Sans", sans-serif;
          font-weight: 700;
          letter-spacing: 0.1em;
        }
        #wachstum-art .card,
        #wachstum-art .tile {
          position: absolute;
          display: flex;
          align-items: center;
          justify-content: center;
          border: 4px solid #1c1c1c;
          background: #ffffff;
          box-shadow: 8px 8px 0 #1c1c1c;
        }
        #wachstum-art .card img {
          display: block;
          height: auto;
        }
        #wachstum-art .tile svg {
          display: block;
        }
        #wachstum-svg {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 1920px;
          overflow: visible;
        }
        /* strokes that draw on */
        #wachstum-svg .ink {
          fill: none;
          stroke: #1c1c1c;
          stroke-width: 7;
          stroke-linecap: round;
          stroke-linejoin: round;
          stroke-dasharray: 1;
          stroke-dashoffset: 1;
          opacity: 0;
        }
        #wachstum-svg .accent {
          stroke: #0d9488;
        }
        #wachstum-svg .warn {
          stroke: #dc2626;
        }
      </style>

      <div id="wachstum-root" data-composition-id="wachstum" data-width="1080" data-height="1920" data-duration="9.333334">
        <div id="wachstum-art">
          <div id="wachstum-ha" class="h" style="font-size: 92px"><span id="wachstum-h1" class="ln in">Umsatzwachstum</span><span id="wachstum-h2" class="ln a in">Nebius schneller</span></div>
          <div id="wachstum-hb" class="h" style="font-size: 92px"><span id="wachstum-h3" class="ln in">Ein genauer Blick</span><span id="wachstum-h4" class="ln a in">lohnt sich</span></div>
          <div id="wachstum-note" class="lbl sm c in" style="left: 110px; top: 640px; width: 500px; height: 40px; font-size: 28px; justify-content: flex-start; color: #555555">Wachstum in Prozent</div>
          <svg id="wachstum-svg" viewBox="0 0 1080 1920">
            <path id="wachstum-base" pathLength="1" class="ink c" d="M110 1232 H970" />
            <path id="wachstum-g1" pathLength="1" class="ink c" style="stroke-width: 10" d="M230 1200 L420 1020" />
            <path id="wachstum-g1h" pathLength="1" class="ink c" style="stroke-width: 10" d="M380 1026 L420 1020 L412 1059" />
            <path id="wachstum-g2" pathLength="1" class="ink accent c" style="stroke-width: 12" d="M650 1200 L850 720" />
            <path id="wachstum-g2h" pathLength="1" class="ink accent c" style="stroke-width: 12" d="M816 741 L850 720 L859 759" />
            <circle id="wachstum-lens" pathLength="1" class="ink" cx="700" cy="960" r="150" style="stroke-width: 12" />
            <path id="wachstum-grip" pathLength="1" class="ink" style="stroke-width: 20" d="M810 1070 L900 1160" />
          </svg>
          <div id="wachstum-c1" class="card c in" style="left: 160px; top: 1252px; width: 300px; height: 96px"><img src="assets/logos/coreweave_logo.png" alt="CoreWeave" style="width: 240px" /></div>
          <div id="wachstum-c2" class="card c in" style="left: 620px; top: 1252px; width: 300px; height: 96px"><img src="assets/logos/nebius_logo.png" alt="Nebius" style="width: 200px" /></div>
          <div id="wachstum-m1" class="lbl sm c in" style="left: 160px; top: 1374px; width: 300px; height: 44px; font-size: 32px">Bewertung ~6×</div>
          <div id="wachstum-m2" class="lbl sm a c in" style="left: 620px; top: 1374px; width: 300px; height: 44px; font-size: 32px">Bewertung 45×</div>
        </div>
      </div>

      <script>
        {
          // cues are voiceover seconds (prep/voiceover.words.json); the voiceover plays at RATE, T() gives scene-local time
          const VO0 = 69.733333;
          const RATE = 1.1;
          const DUR = 9.333334;
          const T = (vo) => Math.max(0, Math.round(((vo - VO0) / RATE) * 1000) / 1000);
          const tl = gsap.timeline({ paused: true });
          const pop = (target, vo) => tl.fromTo(target, { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.34, ease: "back.out(2)" }, T(vo));
          const rise = (target, vo) => tl.fromTo(target, { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, T(vo));
          const slide = (target, vo, x = -60) => tl.fromTo(target, { x, opacity: 0 }, { x: 0, opacity: 1, duration: 0.36, ease: "power3.out" }, T(vo));
          const draw = (target, vo, duration = 0.4) => {
            tl.set(target, { opacity: 1 }, T(vo));
            tl.fromTo(target, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration, ease: "power2.out" }, T(vo));
          };
          const fade = (target, vo, to = 0) => tl.to(target, { opacity: to, duration: 0.25, ease: "power1.out" }, T(vo));
          const leave = () => tl.to("#wachstum-art", { opacity: 0, duration: 0.18, ease: "power1.in" }, DUR - 0.2);

          pop("#wachstum-c2", 69.86); // "Nebius"
          draw("#wachstum-base", 70.2, 0.5);
          pop("#wachstum-c1", 71.2);
          rise("#wachstum-h1", 71.76); // "beim Umsatz"
          rise("#wachstum-note", 72.3); // "prozentual"
          draw("#wachstum-g1", 72.3, 0.5);
          draw("#wachstum-g1h", 72.7, 0.15);
          draw("#wachstum-g2", 73.04, 0.7); // "deutlich schneller"
          draw("#wachstum-g2h", 73.64, 0.15);
          rise("#wachstum-h2", 73.38);
          pop("#wachstum-m1", 76.14); // "Bewertungsunterschied"
          pop("#wachstum-m2", 76.28);
          // "Ein genauerer Blick lohnt sich": the chart steps back, the lens comes in
          fade("#wachstum-art .c", 77.68, 0.25);
          fade("#wachstum-ha", 77.68);
          rise("#wachstum-h3", 78.16);
          draw("#wachstum-lens", 78.16, 0.5);
          draw("#wachstum-grip", 78.58, 0.2);
          rise("#wachstum-h4", 78.86); // "lohnt sich"
          leave(); // the closing card follows
          window.__timelines["wachstum"] = tl;
        }
      </script>
    </template>
  </body>
</html>
