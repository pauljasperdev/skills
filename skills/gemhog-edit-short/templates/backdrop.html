<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: Urbanist;
          src: url("assets/fonts/urbanist-latin-400-700.woff2") format("woff2");
          font-weight: 400 900;
          font-display: block;
        }
        @font-face {
          font-family: "DM Sans";
          src: url("assets/fonts/dm-sans-latin-400-700.woff2") format("woff2");
          font-weight: 400 900;
          font-display: block;
        }
        #backdrop-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        /* the gemhog.com page every graphic scene sits on; nothing in it moves */
        #backdrop-board {
          position: absolute;
          inset: 0;
          background: #f5f5f0;
          overflow: hidden;
        }
        #backdrop-glow {
          position: absolute;
          left: -60px;
          top: 420px;
          width: 1200px;
          height: 1200px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(213, 240, 238, 0.95) 0%, rgba(213, 240, 238, 0.55) 40%, rgba(213, 240, 238, 0) 70%);
        }
        #backdrop-brand {
          position: absolute;
          left: 90px;
          top: 196px;
          width: 300px;
          height: 44px;
          font-family: Urbanist, sans-serif;
          font-weight: 800;
          font-size: 40px;
          line-height: 44px;
          letter-spacing: -0.02em;
          text-transform: uppercase;
          white-space: nowrap;
          color: #1c1c1c;
        }
        #backdrop-brand span {
          color: #0d9488;
        }
        /* the voiceover is an AI voice: the notice sits bottom-right, under the caption box, for as long as it speaks */
        #backdrop-ai {
          position: absolute;
          left: 590px;
          top: 1716px;
          width: 400px;
          height: 34px;
          font-family: "DM Sans", sans-serif;
          font-weight: 700;
          font-size: 24px;
          line-height: 34px;
          letter-spacing: 0.16em;
          text-align: right;
          text-transform: uppercase;
          white-space: nowrap;
          color: #555555;
        }
        #backdrop-rail {
          position: absolute;
          left: 90px;
          top: 262px;
          width: 900px;
          height: 3px;
          background: #1c1c1c;
        }
      </style>

      <div id="backdrop-root" data-composition-id="backdrop" data-width="1080" data-height="1920" data-duration="__DUR__">
        <div id="backdrop-board">
          <div id="backdrop-glow" data-layout-allow-overflow></div>
          <div id="backdrop-brand">Gemhog<span>.</span></div>
          <div id="backdrop-ai">KI-generiert</div>
          <div id="backdrop-rail"></div>
        </div>
      </div>

      <script>
        {
          const tl = gsap.timeline({ paused: true });
          window.__timelines["backdrop"] = tl;
        }
      </script>
    </template>
  </body>
</html>
