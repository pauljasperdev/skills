<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: Urbanist;
          src: url("assets/fonts/urbanist-latin-400-700.woff2") format("woff2");
          font-weight: 400 900;
          font-display: block;
        }
        @font-face {
          font-family: "DM Sans";
          src: url("assets/fonts/dm-sans-latin-400-700.woff2") format("woff2");
          font-weight: 400 900;
          font-display: block;
        }
        #outro-root {
          position: absolute;
          inset: 0;
        }
        /* closing card: the wordmark and the URL as the site's button, centred above the caption box */
        #outro-art {
          position: absolute;
          left: 90px;
          top: 680px;
          width: 900px;
          height: 440px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 48px;
        }
        #outro-brand {
          display: block;
          font-family: Urbanist, sans-serif;
          font-weight: 800;
          font-size: 200px;
          line-height: 1;
          letter-spacing: -0.03em;
          text-transform: uppercase;
          white-space: nowrap;
          color: #1c1c1c;
        }
        #outro-brand span {
          color: #0d9488;
        }
        #outro-url {
          display: block;
          padding: 18px 44px 24px;
          border: 4px solid #1c1c1c;
          background: #0d9488;
          box-shadow: 8px 8px 0 #1c1c1c;
          font-family: "DM Sans", sans-serif;
          font-weight: 700;
          font-size: 62px;
          line-height: 1;
          letter-spacing: 0.03em;
          white-space: nowrap;
          color: #ffffff;
        }
      </style>

      <div id="outro-root" data-composition-id="outro" data-width="1080" data-height="1920" data-duration="__DUR__">
        <div id="outro-art">
          <p id="outro-brand">Gemhog<span>.</span></p>
          <p id="outro-url">gemhog.com</p>
        </div>
      </div>

      <script>
        {
          const tl = gsap.timeline({ paused: true });
          // short card: it lands at once and holds
          tl.fromTo("#outro-art", { scale: 0.92, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.16, ease: "back.out(2)" }, 0);
          window.__timelines["outro"] = tl;
        }
      </script>
    </template>
  </body>
</html>
