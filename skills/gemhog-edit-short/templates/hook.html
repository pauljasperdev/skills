<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: Urbanist;
          src: url("assets/fonts/urbanist-latin-400-700.woff2") format("woff2");
          font-weight: 400 900;
          font-display: block;
        }
        @font-face {
          font-family: "DM Sans";
          src: url("assets/fonts/dm-sans-latin-400-700.woff2") format("woff2");
          font-weight: 400 900;
          font-display: block;
        }
        #hook-root {
          position: absolute;
          inset: 0;
        }
        /* the band: visual centre (540, 640); raise `top` when the block reaches the speaker's eyes */
        #hook-art {
          position: absolute;
          left: 70px;
          top: 516px;
          width: 940px;
          height: 240px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          font-family: Urbanist, sans-serif;
          font-weight: 800;
          font-size: 82px;
          line-height: 1;
          text-transform: uppercase;
          letter-spacing: -0.02em;
          text-align: center;
        }
        #hook-art p {
          display: block;
          padding: 10px 30px 14px;
          border: 4px solid #1c1c1c;
          box-shadow: 8px 8px 0 #1c1c1c;
          white-space: nowrap;
        }
        #hook-line-1 {
          background: #0d9488;
          color: #ffffff;
        }
        #hook-line-2 {
          background: #ffffff;
          color: #1c1c1c;
        }
      </style>

      <div id="hook-root" data-composition-id="hook" data-width="1080" data-height="1920" data-duration="__DUR__">
        <div id="hook-art">
          <p id="hook-line-1">__LINE1__</p>
          <p id="hook-line-2">__LINE2__</p>
        </div>
      </div>

      <script>
        {
          const DUR = __DUR__;
          const tl = gsap.timeline({ paused: true });
          // visible from the first frame; settles in, leaves before the cut to the board
          tl.fromTo("#hook-art", { scale: 0.9 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, 0);
          tl.to("#hook-art", { opacity: 0, duration: 0.2, ease: "power1.in" }, DUR - 0.42);
          window.__timelines["hook"] = tl;
        }
      </script>
    </template>
  </body>
</html>
