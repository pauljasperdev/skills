<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: Urbanist;
          src: url("assets/fonts/urbanist-latin-400-700.woff2") format("woff2");
          font-weight: 400 900;
          font-display: block;
        }
        @font-face {
          font-family: "DM Sans";
          src: url("assets/fonts/dm-sans-latin-400-700.woff2") format("woff2");
          font-weight: 400 900;
          font-display: block;
        }
        #hook-root {
          position: absolute;
          inset: 0;
        }
        /* the written hook: its lower edge at y 756, above the speaker's eyes; more lines grow upward, never onto the face */
        #hook-art {
          position: absolute;
          left: 70px;
          bottom: 1164px;
          width: 940px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: flex-end;
          gap: 16px;
          font-family: Urbanist, sans-serif;
          font-weight: 800;
          font-size: 82px;
          line-height: 1;
          letter-spacing: -0.025em;
          text-align: center;
        }
        /* white pills, black text, one colour and one size for every line (the user, 2026-10-19) */
        #hook-art p {
          display: block;
          padding: 14px 44px 20px;
          border-radius: 999px;
          box-shadow: 0 14px 34px rgba(28, 28, 28, 0.22);
          white-space: nowrap;
        }
        #hook-art p {
          background: #ffffff;
          color: #1c1c1c;
        }
      </style>

      <div id="hook-root" data-composition-id="hook" data-width="1080" data-height="1920" data-duration="__DUR__">
        <div id="hook-art">
          __LINES__
        </div>
      </div>

      <script>
        {
          const DUR = __DUR__;
          const tl = gsap.timeline({ paused: true });
          // visible from the first frame; settles in, leaves before the cut to the board
          tl.fromTo("#hook-art", { scale: 0.9 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, 0);
          tl.to("#hook-art", { opacity: 0, duration: 0.2, ease: "power1.in" }, DUR - 0.42);
          window.__timelines["hook"] = tl;
        }
      </script>
    </template>
  </body>
</html>
