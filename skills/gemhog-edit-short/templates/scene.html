<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: Urbanist;
          src: url("assets/fonts/urbanist-latin-400-700.woff2") format("woff2");
          font-weight: 400 900;
          font-display: block;
        }
        @font-face {
          font-family: "DM Sans";
          src: url("assets/fonts/dm-sans-latin-400-700.woff2") format("woff2");
          font-weight: 400 900;
          font-display: block;
        }

        #@@-root {
          position: absolute;
          inset: 0;
        }
        /* graphics sit between the lockup (bottom y 265) and the caption box (y 1370) */
        #@@-art {
          position: absolute;
          inset: 0;
          font-family: Urbanist, sans-serif;
          font-weight: 800;
          letter-spacing: -0.02em;
          color: #1c1c1c;
        }
        #@@-art .in {
          opacity: 0;
        }
        #@@-art .a {
          color: #0d9488;
        }
        #@@-art .h {
          position: absolute;
          left: 90px;
          top: 356px;
          width: 900px;
          font-size: 100px;
          line-height: 1;
          letter-spacing: -0.035em;
          text-align: center;
        }
        #@@-art .h .ln {
          display: block;
          white-space: nowrap;
        }
        /* a label: place it with left/top/width/height, size it with font-size */
        #@@-art .lbl {
          position: absolute;
          display: flex;
          align-items: center;
          justify-content: center;
          line-height: 1;
          white-space: nowrap;
        }
        #@@-art .sm {
          font-family: "DM Sans", sans-serif;
          font-weight: 700;
          letter-spacing: 0.1em;
          text-transform: uppercase;
        }
        /* cards and tiles as in the app: white, rounded, a soft border and a soft shadow */
        #@@-art .card,
        #@@-art .tile {
          position: absolute;
          display: flex;
          align-items: center;
          justify-content: center;
          border: 2px solid #e4e2d8;
          border-radius: 28px;
          background: #ffffff;
          box-shadow: 0 14px 36px rgba(28, 28, 28, 0.08);
        }
        #@@-art .tile {
          border-radius: 26%;
        }
        /* a pill: a status, a tag, a short claim */
        #@@-art .pill {
          position: absolute;
          display: flex;
          align-items: center;
          justify-content: center;
          border-radius: 999px;
          background: #1c1c1c;
          color: #ffffff;
          line-height: 1;
          white-space: nowrap;
        }
        #@@-art .card img {
          display: block;
          height: auto;
        }
        #@@-art .tile svg {
          display: block;
        }
        #@@-svg {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 1920px;
          overflow: visible;
        }
        /* strokes that draw on */
        #@@-svg .ink {
          fill: none;
          stroke: #1c1c1c;
          stroke-width: 7;
          stroke-linecap: round;
          stroke-linejoin: round;
          stroke-dasharray: 1;
          stroke-dashoffset: 1;
          opacity: 0;
        }
        #@@-svg .accent {
          stroke: #0d9488;
        }
        #@@-svg .warn {
          stroke: #dc2626;
        }
      </style>

      <div id="@@-root" data-composition-id="@@" data-width="1080" data-height="1920" data-duration="__DUR__">
        <div id="@@-art">
          <!-- heading: <div class="h"><span id="@@-h1" class="ln in">…</span></div>; strokes go in <svg id="@@-svg" viewBox="0 0 1080 1920"> -->
        </div>
      </div>

      <script>
        {
          // cues are voiceover seconds (prep/voiceover.words.json); the voiceover plays at RATE, T() gives scene-local time
          const VO0 = __VO0__;
          const RATE = __RATE__;
          const DUR = __DUR__;
          const T = (vo) => Math.max(0, Math.round(((vo - VO0) / RATE) * 1000) / 1000);
          const tl = gsap.timeline({ paused: true });
          const pop = (target, vo) => tl.fromTo(target, { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.34, ease: "back.out(2)" }, T(vo));
          const rise = (target, vo) => tl.fromTo(target, { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, T(vo));
          const slide = (target, vo, x = -60) => tl.fromTo(target, { x, opacity: 0 }, { x: 0, opacity: 1, duration: 0.36, ease: "power3.out" }, T(vo));
          const draw = (target, vo, duration = 0.4) => {
            tl.set(target, { opacity: 1 }, T(vo));
            tl.fromTo(target, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration, ease: "power2.out" }, T(vo));
          };
          const fade = (target, vo, to = 0) => tl.to(target, { opacity: to, duration: 0.25, ease: "power1.out" }, T(vo));
          const leave = () => tl.to("#@@-art", { opacity: 0, duration: 0.18, ease: "power1.in" }, DUR - 0.2);
          // cues: pop("#@@-h1", 12.34); // "the spoken word"
          leave();
          window.__timelines["@@"] = tl;
        }
      </script>
    </template>
  </body>
</html>
